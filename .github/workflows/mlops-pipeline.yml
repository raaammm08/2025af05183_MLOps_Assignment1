name: MLOps Continuous Integration and Delivery Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.9"
  STUDENT_ID: "2025af05183"
  COURSE_ID: "AIMLCZG523"

jobs:
  lint:
    name: Code Quality and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 127
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  test:
    name: Automated Unit Testing & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Unit Tests with Coverage
        run: |
          PYTHONPATH=. pytest -v --cov=src --cov-report=term-missing --cov-report=xml tests/

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report-${{ env.STUDENT_ID }}
          path: coverage.xml
          retention-days: 14

  train-and-evaluate:
    name: Model Retraining, MLflow Tracking & Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data Acquisition & EDA
        run: |
          PYTHONPATH=. python src/data/download_data.py
          MPLCONFIGDIR=/tmp PYTHONPATH=. python src/data/eda.py

      - name: Retrain Models and Track with MLflow
        run: |
          MPLCONFIGDIR=/tmp PYTHONPATH=. python src/models/train.py
          MPLCONFIGDIR=/tmp PYTHONPATH=. python src/models/generate_mlflow_dashboard.py

      - name: Verify Model Benchmark Threshold
        run: |
          python -c "
          import json
          with open('reports/metrics_summary.json') as f:
              data = json.load(f)
          champ = data['champion_model']
          acc = data[champ]['metrics']['test_accuracy']
          auc = data[champ]['metrics']['test_roc_auc']
          print(f'Champion Model: {champ} | Test Acc: {acc:.4f} | ROC-AUC: {auc:.4f}')
          assert acc >= 0.80, f'Accuracy {acc} below 0.80 benchmark!'
          assert auc >= 0.85, f'ROC-AUC {auc} below 0.85 benchmark!'
          print('Benchmark validation passed!')
          "

      - name: Archive Model and Performance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts-${{ env.STUDENT_ID }}
          path: |
            models/heart_disease_model.joblib
            reports/metrics_summary.json
            reports/screenshots/
          retention-days: 30

  containerize-and-smoke-test:
    name: Container Build & API Smoke Test
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t heart-disease-api:${{ env.STUDENT_ID }} .

      - name: Run Container for Smoke Testing
        run: |
          docker run -d --name test-api -p 8000:8000 heart-disease-api:${{ env.STUDENT_ID }}
          sleep 5

      - name: Execute Endpoint Health & Predict Verification
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 63.0, "sex": 1.0, "cp": 1.0, "trestbps": 145.0, "chol": 233.0, "fbs": 1.0, "restecg": 2.0, "thalach": 150.0, "exang": 0.0, "oldpeak": 2.3, "slope": 3.0, "ca": 0.0, "thal": 6.0}' || exit 1
          docker stop test-api
